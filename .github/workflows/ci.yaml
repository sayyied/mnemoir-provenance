name: CI
on:
  push:
  pull_request:
jobs:
  test:
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Verify clean projection
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          PYTHONPATH: src
        run: python scripts/verify_candidate.py
      - run: python -m pip install '.[test,release]'
      - run: python -m pytest -q
      - run: python -m build
  exact-official-hermes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install exact official Hermes
        run: |
          git clone https://github.com/NousResearch/hermes-agent.git "$RUNNER_TEMP/hermes-agent"
          git -C "$RUNNER_TEMP/hermes-agent" checkout 0a62610f10cc34d696b2239b2c69fa1ba0f1ca63
          python -m pip install -e "$RUNNER_TEMP/hermes-agent"
          test "$(git -C "$RUNNER_TEMP/hermes-agent" rev-parse HEAD)" = "0a62610f10cc34d696b2239b2c69fa1ba0f1ca63"
      - run: python -m pip install -e '.[test]'
      - name: Verify exact Hermes discovery and lifecycle
        run: python scripts/verify_exact_hermes.py
