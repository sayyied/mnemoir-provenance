name: Publish v0.2.4 to PyPI

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pypi-publish:
    name: Publish exact v0.2.4 artifacts
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/mnemoir-provenance
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download exact release artifacts
        run: |
          mkdir -p dist
          base="https://github.com/$GITHUB_REPOSITORY/releases/download/v0.2.4"
          curl --fail --silent --show-error --location --retry 3 \
            "$base/mnemoir_provenance-0.2.4-py3-none-any.whl" \
            --output dist/mnemoir_provenance-0.2.4-py3-none-any.whl
          curl --fail --silent --show-error --location --retry 3 \
            "$base/mnemoir_provenance-0.2.4.tar.gz" \
            --output dist/mnemoir_provenance-0.2.4.tar.gz

      - name: Verify artifact identity
        run: |
          test "$(printf '%s\n' dist/* | wc -l)" -eq 2
          printf '%s  %s\n' \
            '5c7b80d3d7baf4dd2fa19adc55cca9e7b0f50b2da44306cc524da14641f3586d' \
            'dist/mnemoir_provenance-0.2.4-py3-none-any.whl' \
            '880443387a806d305067dd9fed0178563ebc18a382d663fa621063b89c43332c' \
            'dist/mnemoir_provenance-0.2.4.tar.gz' | sha256sum --check --strict

      - name: Publish to PyPI with OIDC
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b
        with:
          packages-dir: dist/
