name: Publish v0.3.0 to PyPI

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pypi-publish:
    if: github.ref == 'refs/heads/main'
    name: Publish exact v0.3.0 artifacts
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/mnemoir-provenance
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download exact release artifacts
        run: |
          mkdir -p dist
          base="https://github.com/$GITHUB_REPOSITORY/releases/download/v0.3.0"
          curl --fail --silent --show-error --location --retry 3 \
            "$base/mnemoir_provenance-0.3.0-py3-none-any.whl" \
            --output dist/mnemoir_provenance-0.3.0-py3-none-any.whl
          curl --fail --silent --show-error --location --retry 3 \
            "$base/mnemoir_provenance-0.3.0.tar.gz" \
            --output dist/mnemoir_provenance-0.3.0.tar.gz

      - name: Verify artifact identity
        run: |
          test "$(printf '%s\n' dist/* | wc -l)" -eq 2
          printf '%s  %s\n' \
            'decbae9d559634832e600858f44dbedd6a4c585b00a4925c82ff74e9d8de63ca' \
            'dist/mnemoir_provenance-0.3.0-py3-none-any.whl' \
            'e6cf2282734a5dc7662c68de3272c016df2940fd1eee249164ddd36879ab9d25' \
            'dist/mnemoir_provenance-0.3.0.tar.gz' | sha256sum --check --strict

      - name: Publish to PyPI with OIDC
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b
        with:
          packages-dir: dist/
          attestations: true
